server_name: decolumax-sync
port: 4222
max_payload: 128KB
max_connections: 32
max_subscriptions: 64
write_deadline: 2s

authorization {
  users: [
    {
      user: $NATS_SYNC_USER
      password: $NATS_SYNC_PASSWORD
      permissions: {
        publish: { allow: ["deco.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["deco.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.>"] }
      }
    }
  ]
}

tls {
  cert_file: "/etc/nats/certs/fullchain.pem"
  key_file: "/etc/nats/certs/privkey.pem"
  timeout: 2
}

jetstream {
  store_dir: "/data/jetstream"
  max_mem: 64MB
  max_file: 128MB
  sync_interval: "always"
}
